syntax = "proto3";

package pim.v1;

option go_package = "github.com/sunfmin/apidemo2/backend/api/gen/pim/v1;pimv1";

import "google/protobuf/timestamp.proto";

// ProductInventory represents stock information for a product
// Separated from Product AND Pricing for real-time inventory management
message ProductInventory {
  string id = 1;
  string product_id = 2; // Reference to Product
  string location_id = 3; // Warehouse/location identifier (for multi-location support)
  int32 on_hand_quantity = 4; // Physical stock available
  int32 reserved_quantity = 5; // Stock reserved for pending orders
  int32 available_quantity = 6; // Calculated: on_hand - reserved
  int32 on_order_quantity = 7; // Stock on order from suppliers
  google.protobuf.Timestamp last_counted_at = 8; // Last physical count
  google.protobuf.Timestamp updated_at = 9; // Last inventory update
}

// VariantInventory represents stock information for a product variant
message VariantInventory {
  string id = 1;
  string variant_id = 2; // Reference to ProductVariant
  string location_id = 3; // Warehouse/location identifier
  int32 on_hand_quantity = 4; // Physical stock available
  int32 reserved_quantity = 5; // Stock reserved for pending orders
  int32 available_quantity = 6; // Calculated: on_hand - reserved
  int32 on_order_quantity = 7; // Stock on order from suppliers
  google.protobuf.Timestamp last_counted_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

// UpdateInventoryRequest - for updating stock levels
message UpdateInventoryRequest {
  string product_id = 1; // Required
  string location_id = 2; // Required for multi-location
  int32 on_hand_quantity = 3; // Optional, absolute quantity
  int32 reserved_quantity = 4; // Optional, update reserved amount
}

// UpdateInventoryResponse
message UpdateInventoryResponse {
  ProductInventory inventory = 1;
}

// AdjustStockRequest - for stock adjustments (sales, restocks, corrections)
message AdjustStockRequest {
  string product_id = 1; // Required
  string location_id = 2; // Required for multi-location
  int32 quantity_delta = 3; // Positive for restock, negative for sale
  string reason = 4; // e.g., "sale", "restock", "correction", "damaged", "transfer"
  string reference = 5; // Optional: order ID, PO number, etc.
}

// AdjustStockResponse
message AdjustStockResponse {
  ProductInventory inventory = 1;
  int32 previous_quantity = 2;
  int32 new_quantity = 3;
}

// ReserveStockRequest - reserve stock for orders
message ReserveStockRequest {
  string product_id = 1;
  string location_id = 2;
  int32 quantity = 3; // Amount to reserve
  string order_id = 4; // Order reference
}

// ReserveStockResponse
message ReserveStockResponse {
  ProductInventory inventory = 1;
  bool success = 2;
}

