syntax = "proto3";

package pim.v1;

option go_package = "github.com/sunfmin/apidemo2/backend/api/gen/pim/v1;pimv1";

import "common.proto";
import "google/protobuf/timestamp.proto";

// ProductVariant represents a variant of a product
message ProductVariant {
  string id = 1;
  string product_id = 2;
  string product_name = 3; // Denormalized for display
  string name = 4;
  string sku = 5;
  map<string, AttributeValue> attribute_values = 6; // Override values only
  map<string, AttributeValue> effective_attribute_values = 7; // Merged with parent (overrides + inherited)
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  repeated string primary_image_urls = 10; // URLs of primary images
}

// CreateVariantRequest
message CreateVariantRequest {
  string product_id = 1; // Required, must reference existing product
  string name = 2; // Required, 1-255 characters
  string sku = 3; // Required, 1-100 characters, unique, alphanumeric + dash/underscore
  map<string, AttributeValue> attribute_values = 4; // Optional, override specific attributes
}

// CreateVariantResponse
message CreateVariantResponse {
  ProductVariant variant = 1;
}

// GetVariantRequest
message GetVariantRequest {
  string id = 1; // Required, UUID
  bool include_media = 2; // Optional, include media files in response
}

// GetVariantResponse
message GetVariantResponse {
  ProductVariant variant = 1;
  repeated MediaFile media_files = 2; // If include_media = true
}

// MediaFile reference (defined in media.proto, included here for response)
message MediaFile {
  string id = 1;
  string attribute_name = 2;
  MediaFileType file_type = 3;
  string mime_type = 4;
  string file_name = 5;
  string url = 6;
  string thumbnail_url = 7;
  int64 file_size = 8;
  int32 width = 9;
  int32 height = 10;
  int32 duration = 11;
  int32 display_order = 12;
  google.protobuf.Timestamp created_at = 13;
}

// ListVariantsRequest
message ListVariantsRequest {
  string product_id = 1; // Required, UUID of parent product
  PaginationRequest pagination = 2;
  string search = 3; // Optional, search by name or SKU
  string sort_by = 4; // Optional, field to sort by (name, sku, created_at)
  string sort_order = 5; // Optional, "asc" or "desc" (default: "asc")
}

// ListVariantsResponse
message ListVariantsResponse {
  repeated ProductVariant variants = 1;
  PaginationResponse pagination = 2;
}

// UpdateVariantRequest
message UpdateVariantRequest {
  string id = 1; // Required, UUID
  string name = 2; // Optional
  string sku = 3; // Optional, must be unique if provided
  map<string, AttributeValue> attribute_values = 4; // Optional, updates/adds override attributes
}

// UpdateVariantResponse
message UpdateVariantResponse {
  ProductVariant variant = 1;
}

// DeleteVariantRequest
message DeleteVariantRequest {
  string id = 1; // Required, UUID
}

// DeleteVariantResponse
message DeleteVariantResponse {
  bool success = 1;
}

// BulkCreateVariantsRequest - Create multiple variants at once
message BulkCreateVariantsRequest {
  string product_id = 1; // Required, parent product UUID
  repeated VariantInput variants = 2; // Required, list of variants to create
}

// VariantInput for bulk creation
message VariantInput {
  string name = 1;
  string sku = 2;
  map<string, AttributeValue> attribute_values = 3;
}

// BulkCreateVariantsResponse
message BulkCreateVariantsResponse {
  repeated ProductVariant variants = 1; // Successfully created variants
  repeated BulkCreateError errors = 2; // Errors for failed variants
}

// BulkCreateError
message BulkCreateError {
  int32 index = 1; // Index in the input array
  string sku = 2; // SKU that failed
  string error_message = 3;
}

// Variant API endpoints:
// POST   /api/v1/products/{product_id}/variants       - Create variant
// GET    /api/v1/variants/{id}                        - Get variant by ID
// GET    /api/v1/products/{product_id}/variants       - List variants for product
// PUT    /api/v1/variants/{id}                        - Update variant
// DELETE /api/v1/variants/{id}                        - Delete variant
// POST   /api/v1/products/{product_id}/variants/bulk  - Bulk create variants

